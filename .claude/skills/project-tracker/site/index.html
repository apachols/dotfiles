<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<meta name="description" content="Executive-summary change logs for a project's requirements docs, PRs and mocks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='3' fill='none' stroke='%232f6fdf' stroke-width='3'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h7' stroke='%232f6fdf' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#" id="brand">Project Tracker</a>
    <span class="freshness" id="freshness"></span>
  </div>
</header>

<main class="wrap">
  <section id="view" aria-live="polite"></section>
</main>

<footer class="footer">
  <div class="wrap">
    Summaries are written by an agent from each source's history. Open the source for the full detail.
    Read and unread marks live in this browser only.
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
